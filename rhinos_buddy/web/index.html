<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhino's Buddy Supervisor</title>
<script>
// theme before the first paint (no flash): saved choice, else the system preference
(function () {
  var t = "dark";
  try { t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); } catch (_) {}
  document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
})();
</script>
<style>
:root{
  --bg:#0e1117; --panel:#151a23; --panel2:#1b2230; --line:#283043; --line2:#344058;
  --text:#e8ecf3; --muted:#8b95a7; --accent:#4dabf7; --accent-d:#2f8bd6; --ok:#35c46d; --warn:#f2b84b; --bad:#e5484d;
  --radius:10px;
  --switch-off:#313b50; --toast-bg:#222a3a; --glow:#18202e; --danger-text:#ff8e93; --warn-line:#6b5420; --warn-text:#e9cf92;
  --stage-frame:#1a1f2a; --stage-frame2:#323b4f; --shadow:rgba(0,0,0,.55); --accent-soft:rgba(77,171,247,.14);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f2f4f8; --panel:#ffffff; --panel2:#eef1f6; --line:#d8dde7; --line2:#bfc7d6;
  --text:#1b2230; --muted:#59657a; --accent:#1c7ed6; --accent-d:#1971c2; --ok:#2b9a57; --warn:#c07a00; --bad:#d6343c;
  --switch-off:#c4cbd8; --toast-bg:#ffffff; --glow:#e4ecf8; --danger-text:#c92a2a; --warn-line:#e3bd5c; --warn-text:#7a5200;
  --stage-frame:#cfd6e3; --stage-frame2:#aeb8cb; --shadow:rgba(40,55,90,.28); --accent-soft:rgba(28,126,214,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  display:flex;flex-direction:column;min-height:100vh}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:.2px}
.brand .logo{width:26px;height:18px;border:2px solid var(--accent);border-radius:4px;position:relative}
.brand .logo::after{content:"";position:absolute;inset:3px;background:linear-gradient(135deg,var(--accent),#35c46d);border-radius:1px;opacity:.85}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:13px;cursor:default}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn)}
.pill.ok .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pill.bad .dot{background:var(--bad)}
#savestate{color:var(--muted);font-size:13px;min-width:90px;text-align:right}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0;min-height:0}
@media (max-width:1000px){main{grid-template-columns:1fr}}
#left{padding:18px 22px;display:flex;flex-direction:column;gap:14px;min-width:0;overflow:auto}
#right{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
/* pages */
#pagebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--muted);user-select:none}
.chip:hover{border-color:var(--line2);color:var(--text)}
.chip.on{background:var(--panel2);border-color:var(--accent);color:var(--text)}
.chip.add{border-style:dashed}
/* stage */
#stagewrap{display:flex;justify-content:center;padding:26px 10px;background:
  radial-gradient(circle at 50% 0%,var(--glow) 0%,transparent 70%),var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
#stage{position:relative;background:#000;border-radius:6px;
  box-shadow:0 0 0 7px var(--stage-frame),0 0 0 8px var(--stage-frame2),0 24px 60px var(--shadow);touch-action:none}
#live{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;image-rendering:auto}
#grid{position:absolute;inset:0;pointer-events:none;border-radius:6px;display:none;
  background-image:linear-gradient(to right,rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.08) 1px,transparent 1px)}
#slots{position:absolute;inset:0}
.slot{position:absolute;border:1px dashed rgba(255,255,255,.28);border-radius:3px;cursor:grab;outline:none}
.slot:hover{border-color:var(--accent);background:rgba(77,171,247,.09)}
.slot:focus-visible{border-color:#fff}
.slot.sel{border:2px solid var(--accent);background:rgba(77,171,247,.12);cursor:grab}
.slot.hid{border-style:dotted;opacity:.55}
.layers{display:flex;flex-direction:column;gap:4px;max-height:230px;overflow:auto;margin-bottom:8px}
.lrow{display:flex;align-items:center;gap:4px}
.lrow .pick{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:1px;padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--panel2,#161b26);color:inherit;cursor:pointer;font:inherit}
.lrow .pick.on{border-color:var(--accent);background:var(--accent-soft)}
.lrow .pick small{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .pick.off{opacity:.55}
.lrow .mini{padding:4px 7px;min-width:28px}
.badge{display:inline-block;margin-left:6px;padding:0 6px;border-radius:9px;background:rgba(77,171,247,.25);font-size:11px}
.slot .tag{position:absolute;left:3px;top:3px;font-size:10px;line-height:1;padding:3px 6px;border-radius:4px;
  background:rgba(14,17,23,.88);color:#cfe3ff;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap}
.slot:hover .tag,.slot.sel .tag{opacity:1}
.slot .rh{position:absolute;width:14px;height:14px;background:var(--accent);border:2px solid #fff;border-radius:4px;display:none;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.slot .rh.nw{left:-7px;top:-7px;cursor:nwse-resize}.slot .rh.ne{right:-7px;top:-7px;cursor:nesw-resize}
.slot .rh.sw{left:-7px;bottom:-7px;cursor:nesw-resize}.slot .rh.se{right:-7px;bottom:-7px;cursor:nwse-resize}
.slot.sel .rh{display:block;z-index:6}
.slot.sel{overflow:visible}
@media (pointer:coarse){.slot .rh{width:22px;height:22px}.slot .rh.nw{left:-11px;top:-11px}.slot .rh.ne{right:-11px;top:-11px}.slot .rh.sw{left:-11px;bottom:-11px}.slot .rh.se{right:-11px;bottom:-11px}}
details.beta{border:1px dashed var(--line2);border-radius:var(--radius);padding:8px 12px;margin-bottom:10px;background:var(--panel2)}
details.beta>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.beta>summary::-webkit-details-marker{display:none}
details.beta>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.beta[open]>summary::before{transform:rotate(90deg)}
details.beta .tagbeta{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-weight:600}
details.beta ul{margin:8px 0 6px;padding-left:18px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal .box{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:14px;max-width:480px;width:100%;padding:22px 24px;box-shadow:0 20px 60px var(--shadow)}
.modal h2{margin:0 0 2px;font-size:18px}
.modal .sub{color:var(--muted);margin-bottom:12px}
.modal ul{margin:0 0 14px;padding-left:20px}.modal li{margin-bottom:6px}
.modal .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.modal .foot .sw{margin:0}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:#9fb0c8;padding:30px;pointer-events:none;
  font-size:14px}
#stagetools{display:flex;gap:18px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* page settings */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.card h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
/* tabs */
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;padding:12px 6px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font-weight:600}
#tabs button:hover{color:var(--text)}
#tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
#panel{flex:1;overflow:auto;padding:16px 18px 30px;min-height:0}
.group{margin-bottom:18px}
.group>h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>label,.field>.lab{color:var(--muted);font-size:12.5px}
input[type=text],input[type=number],select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);outline:none}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent)}
input[type=color]{width:42px;height:34px;padding:2px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
.inline{display:flex;gap:8px;align-items:center}
.inline>*{flex:0 0 auto}.inline>.grow{flex:1 1 auto}
.num4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.num4 .field{margin:0}
.sw{display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;color:var(--text)}
.sw input{appearance:none;width:36px;height:20px;border-radius:999px;background:var(--switch-off);position:relative;cursor:pointer;transition:background .15s;flex:0 0 auto;margin:0}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--accent-d)}
.sw input:checked::after{transform:translateX(16px)}
.sw input:disabled{opacity:.5;cursor:not-allowed}
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent-d);border-color:var(--accent-d);color:#fff}
.btn.danger{color:var(--danger-text)}.btn.danger:hover{border-color:var(--bad)}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.palette .btn{font-size:13px}
.hint{color:var(--muted);font-size:12.5px}
.note{padding:10px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:13px;margin-bottom:12px}
.note.warn{border-color:var(--warn-line);color:var(--warn-text)}
.thumb{width:100%;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#000;display:block}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.kv span:nth-child(odd){color:var(--muted)}
.src{display:flex;align-items:center;gap:8px;font-size:13px;margin:2px 0}
.src .dot{width:8px;height:8px}
.src.ok .dot{background:var(--ok)}.src.bad .dot{background:var(--bad)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--toast-bg);border:1px solid var(--line2);padding:10px 18px;box-shadow:0 6px 24px var(--shadow);
  border-radius:10px;opacity:0;transition:all .25s;pointer-events:none;z-index:50;max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{border-color:var(--bad);color:var(--danger-text)}
code{background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:12.5px;word-break:break-all}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo"></span>Rhino's Buddy Supervisor</div>
  <div class="spacer"></div>
  <button id="themebtn" class="btn small" type="button" aria-label="Alternar modo claro e escuro"></button>
  <div id="pill" class="pill" title=""><span class="dot"></span><span id="pilltext">Conectando…</span></div>
  <div id="savestate"></div>
</header>

<main>
  <section id="left">
    <div id="pagebar"></div>
    <div id="stagewrap">
      <div id="stage" tabindex="-1">
        <img id="live" alt="Pré-visualização da tela" draggable="false">
        <div id="grid"></div>
        <div id="slots"></div>
        <div id="empty">Esta página está vazia.<br>Adicione módulos ao lado ou escolha um modelo abaixo.</div>
      </div>
    </div>
    <div id="stagetools">
      <label class="sw" style="margin:0"><input type="checkbox" id="showgrid"> Mostrar grade</label>
      <span class="hint">Arraste para mover · puxe qualquer canto azul para redimensionar · clique fora para desmarcar · Alt+clique seleciona o de baixo · setas movem · Delete remove</span>
    </div>
    <div class="card" id="pagecfg"></div>
  </section>

  <aside id="right">
    <div id="tabs" role="tablist">
      <button data-tab="modulo" class="on" role="tab">Módulos</button>
      <button data-tab="aparencia" role="tab">Aparência</button>
      <button data-tab="tela" role="tab">Tela</button>
      <button data-tab="sistema" role="tab">Sistema</button>
    </div>
    <div id="panel"></div>
  </aside>
</main>
<div id="toast" role="status"></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k in e && k !== "list") e[k] = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "X-Rhinos-Buddy": "1", ...(opts.headers || {}) } });
  let data = {}; try { data = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
const post = (p, body) => api(p, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let toastTimer;
function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.className = "show" + (err ? " err" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = "", err ? 5000 : 2200);
}

// ------------------------------------------------------------------ state
const S = { layout: null, cat: null, status: {}, media: [], autostart: {}, home: "", sel: -1, page: 0, tab: "modulo", ports: null, sensors: null };
let dragging = false;
const page = () => S.layout.pages[S.page];
const slot = () => (S.sel >= 0 ? page().slots[S.sel] : null);
const mod = id => S.cat.modules.find(m => m.id === id);
const CELL = () => S.cat.cell;
const isPortrait = () => S.layout.device.orientation.includes("portrait");
const gridSize = () => isPortrait() ? [8, 12] : [12, 8];
const screenPx = () => { const [c, r] = gridSize(); return [c * CELL(), r * CELL()]; };

// ------------------------------------------------------------------ saving
let saveTimer = null, saving = false, dirty = false;
function setSave(t) { $("#savestate").textContent = t; }
function commit() { dirty = true; setSave("Salvando…"); clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 250); }
async function doSave() {
  if (saving || dragging) { saveTimer = setTimeout(doSave, 150); return; }
  saving = true; dirty = false;
  try {
    const r = await post("/api/layout", S.layout);
    if (!dirty && JSON.stringify(r.layout) !== JSON.stringify(S.layout)) { S.layout = r.layout; clampSelection(); renderAll(); }
    setSave(dirty ? "Salvando…" : "Salvo ✓");
  } catch (e) { toast("Não foi possível salvar: " + e.message, true); setSave("Erro ao salvar"); }
  finally { saving = false; }
}
function clampSelection() {
  if (S.page >= S.layout.pages.length) S.page = S.layout.pages.length - 1;
  if (S.sel >= page().slots.length) S.sel = -1;
}

// ------------------------------------------------------------------ orientation (landscape <-> portrait)
const family = o => (o.includes("portrait") ? "portrait" : "landscape");
const GRIDS = { landscape: [12, 8], portrait: [8, 12] };
function remapSlots(slots, from, to, fixed) {
  // Cards with no remembered spot in the new orientation: scale them to the new grid, then put each one on the free
  // spot nearest to where it was, in reading order, so cards never end up on top of each other.  ``fixed`` are the
  // cards that already have their place (restored from memory) and are not moved.
  const [oc, orows] = GRIDS[from], [nc, nr] = GRIDS[to];
  const occ = new Set();
  const take = (c, r, w, h) => { for (let x = 0; x < w; x++) for (let y = 0; y < h; y++) occ.add((c + x) + "," + (r + y)); };
  const fits = (c, r, w, h) => { for (let i = 0; i < w; i++) for (let j = 0; j < h; j++) if (occ.has((c + i) + "," + (r + j))) return false; return true; };
  fixed.forEach(s => { if (!s.hidden) take(s.col, s.row, s.w, s.h); });
  const order = slots.map((s, i) => i).sort((a, b) => slots[a].row - slots[b].row || slots[a].col - slots[b].col || a - b);
  const out = new Array(slots.length);
  for (const i of order) {
    const s = slots[i];
    const w0 = clamp(Math.round(s.w * nc / oc), 1, nc), h0 = clamp(Math.round(s.h * nr / orows), 1, nr);
    const wc = clamp(Math.round(s.col * nc / oc), 0, nc - w0), wr = clamp(Math.round(s.row * nr / orows), 0, nr - h0);
    // the scaled size if there is room for it, otherwise the largest smaller size that fits somewhere
    const sizes = [];
    for (let dw = 0; dw < w0; dw++) for (let dh = 0; dh < h0; dh++) sizes.push([w0 - dw, h0 - dh, dw + dh]);
    sizes.sort((a, b) => a[2] - b[2]);
    let best = null, w = w0, h = h0;
    for (const [sw, sh] of sizes) {
      let bestD = 1e9;
      for (let r = 0; r + sh <= nr; r++) for (let c = 0; c + sw <= nc; c++) {
        const d = Math.abs(c - wc) + Math.abs(r - wr) * 1.01;   // ties prefer staying in the same column
        if (d < bestD && (s.hidden || fits(c, r, sw, sh))) { best = [c, r]; bestD = d; }
      }
      if (best) { w = sw; h = sh; break; }
    }
    const [c, r] = best || [wc, wr];                          // really no room (more cards than cells): keep the scaled spot
    if (!s.hidden) take(c, r, w, h);                          // this card now owns its cells
    out[i] = { c, r, w, h };
  }
  return out;
}
function changeOrientation(v) {
  const d = S.layout.device, from = family(d.orientation), to = family(v);
  d.orientation = v;
  if (from !== to) {
    S.layout.pages.forEach(p => {
      // every card remembers where it was in each orientation: rotating back puts it exactly where it was
      p.slots.forEach(s => { s.alt = s.alt || {}; s.alt[from] = { col: s.col, row: s.row, w: s.w, h: s.h }; });
      const known = p.slots.filter(s => s.alt[to]), fresh = p.slots.filter(s => !s.alt[to]);
      const placed = fresh.length ? remapSlots(fresh, from, to, known.map(s => ({ ...s.alt[to], hidden: s.hidden }))) : [];
      known.forEach(s => { Object.assign(s, s.alt[to]); delete s.alt[to]; });
      fresh.forEach((s, i) => { const g = placed[i]; s.col = g.c; s.row = g.r; s.w = g.w; s.h = g.h; delete s.alt[to]; });
    });
  }
  S.sel = -1; commit(); renderAll();
}

// ------------------------------------------------------------------ pages bar + page settings
function renderPages() {
  const bar = $("#pagebar"); bar.replaceChildren();
  S.layout.pages.forEach((p, i) => bar.append(h("div", {
    class: "chip" + (i === S.page ? " on" : ""), role: "tab", title: "Duplo clique para renomear",
    onclick: () => { S.page = i; S.sel = -1; renderAll(); },
    ondblclick: () => { const n = prompt("Nome da página:", p.name); if (n && n.trim()) { p.name = n.trim().slice(0, 30); commit(); renderPages(); renderPageCfg(); } },
  }, p.name)));
  if (S.layout.pages.length < 8) bar.append(h("div", { class: "chip add", onclick: addPage }, "+ Página"));
}
function renderPageCfg() {
  const box = $("#pagecfg"); box.replaceChildren();
  const p = page(), multi = S.layout.pages.length > 1;
  const tpl = h("select", {}, h("option", { value: "" }, "Aplicar modelo…"), S.cat.templates.map(([k, v]) => h("option", { value: k }, v)));
  tpl.onchange = async () => {
    if (!tpl.value) return;
    if (p.slots.length && !confirm("Substituir os módulos desta página pelo modelo escolhido?")) { tpl.value = ""; return; }
    try {
      const r = await api("/api/template?name=" + tpl.value + "&orientation=" + S.layout.device.orientation);
      p.slots = r.slots; S.sel = -1; commit(); renderAll();
    } catch (e) { toast(e.message, true); }
  };
  box.append(
    h("h3", {}, "Esta página"),
    h("div", { class: "row" },

    let ok = true; for (let i = 0; i < w && ok; i++) for (let j = 0; j < h; j++) if (occ.has((c + i) + "," + (r + j))) { ok = false; break; }

      selectField("Fonte", fonts, () => t.font, v => { t.font = v; commit(); }),
      h("div", { class: "hint", style: "margin:-6px 0 12px" }, "Precisa estar instalada no Windows; se não estiver, uma fonte padrão é usada."),
      colorField("Texto principal", () => t.text, v => { t.text = v; commit(); }, false),
      colorField("Texto secundário", () => t.muted, v => { t.muted = v; commit(); }, false),
      colorField("Temperaturas", () => t.temp, v => { t.temp = v; commit(); }, false),
      colorField("Alerta (uso acima de 90%)", () => t.warn, v => { t.warn = v; commit(); }, false),
      selectField("Indicador dos módulos (CPU, GPU, RAM…)", [["barra", "Barras horizontais"], ["radial", "Radial (círculos)"]],
        () => t.bar_style, v => { t.bar_style = v; commit(); }),
      h("div", { class: "hint", style: "margin:-6px 0 12px" }, "Vale para todos os módulos; cada módulo pode ter o seu próprio estilo nas opções dele (“Seguir o tema”, barra ou radial)."),
      switchField("Uma cor diferente por módulo", () => t.colorful, v => { t.colorful = v; commit(); renderPanel(); }),
      t.colorful ? null : colorField("Cor de destaque única", () => t.accent, v => { t.accent = v; commit(); }, false),
      switchField("Números com vírgula (11,4 GB)", () => t.decimal_comma, v => { t.decimal_comma = v; commit(); })),
  ];
}

// ------------------------------------------------------------------ panel: screen
function statusCard() {
  const st = S.status || {};
  return h("div", { class: "note" + (st.connected ? "" : " warn"), id: "statuscard" },
    h("b", {}, st.connected ? "● Conectada" + (st.port ? " (" + st.port + ")" : "") : "● Sem tela"), h("br"), st.message || "");
}
function usbText() {
  const k = (S.status || {}).usb_kbs;
  return S.status && S.status.connected ? "Envio médio para a tela: " + (k || 0).toFixed(1).replace(".", ",") + " KB/s (limite ≈ 128 KB/s)." : "";
}
function notifText() {
  const n = (S.status || {}).notifications;
  if (!(n && n.enabled)) return "";
  const src = n.source === "toast" ? "central do Windows" : n.source === "title" ? "título da aba" : "";
  return n.message + (src ? " Fonte: " + src + " · " + n.pending + " pendente(s) agora." : "");
}
function panelTela() {
  const d = S.layout.device;
  if (!S.ports) loadPorts();
  const ports = S.ports || [];
  const choices = [["auto", "Automático (recomendado)"]].concat(ports.map(p => [p.device, p.device + " — " + p.description + (p.is_screen ? "  ★ tela detectada" : "")]));
  if (!choices.some(c => c[0] === d.port)) choices.push([d.port, d.port + " (não encontrada)"]);
  return [
    statusCard(),
    h("div", { class: "row", style: "margin-bottom:16px" },
      h("button", { class: "btn primary", onclick: async () => { await post("/api/reconnect", {}); toast("Reconectando…"); } }, "Reconectar"),
      h("button", { class: "btn", onclick: () => { S.ports = null; renderPanel(); } }, "Atualizar portas")),
    h("div", { class: "group" }, h("h4", {}, "Conexão"),
      selectField("Porta", choices, () => d.port, v => { d.port = v; commit(); })),
    h("div", { class: "group" }, h("h4", {}, "Imagem"),
      selectField("Rotação da tela", S.cat.rotations, () => d.orientation, v => changeOrientation(v)),
      h("div", { class: "hint", style: "margin:-6px 0 12px" }, "Se a imagem aparecer de cabeça para baixo, escolha a opção “invertida”. Ao mudar entre paisagem e retrato, os cards são reorganizados sem sobreposição e cada orientação lembra onde cada card ficou: voltar restaura o arranjo anterior."),
      rangeField("Brilho", () => d.brightness, v => { d.brightness = v; commit(); }, 0, 100, "%"),
      selectField("Frequência de atualização dos números", [[1, "Rápida (1 s)"], [2, "Normal (2 s) — recomendado"], [3, "Econômica (3 s)"], [5, "Lenta (5 s)"]],
        () => d.refresh, v => { d.refresh = +v; commit(); }),
      switchField("Trocar de página automaticamente (com mais de uma página)", () => d.rotate, v => { d.rotate = v; commit(); renderPageCfg(); }),
      h("div", { class: "hint", style: "margin:-6px 0 12px" }, "Desligado, a tela fica sempre na primeira página. O tempo de cada página é definido em “Esta página → Duração”."),
      selectField("Estabilidade dos números", [[0, "Tempo real (muda a cada leitura)"], [1, "Suave"], [2, "Calma — menos redesenhos (recomendado)"]],
        () => d.stability, v => { d.stability = +v; commit(); }),
      h("div", { class: "hint" }, "A conexão USB desta tela é lenta (~130 KB/s): cada número que muda é redesenhado aos poucos na tela. “Calma” ignora oscilações pequenas (ex.: CPU 3%→4%) e muda os números só quando a diferença importa."),
      h("div", { class: "hint", id: "usbinfo", style: "margin-top:8px" }, usbText())),
    h("div", { class: "group" }, h("h4", {}, "Notificações"),
      switchField("Mostrar notificações do Windows na tela", () => d.notify, v => { d.notify = v; commit(); }),
      h("div", { class: "hint", style: "margin:-4px 0 12px" }, "Desligado por padrão: o texto das notificações pode ser privado. Ligado, o programa lê as notificações do Windows (WhatsApp Web no navegador, Discord, e-mail…) e mostra um aviso por alguns segundos por cima dos cards que tiverem “Mostrar avisos de notificação” marcado nas opções deles. Nada é gravado nem enviado para fora do computador."),
      numField("Duração do aviso (segundos)", () => d.notify_seconds, v => { d.notify_seconds = v; commit(); }, 2, 30),
      textField("Só destes aplicativos (separe por vírgula; vazio = todos)", () => d.notify_apps, v => { d.notify_apps = v; commit(); }, { placeholder: "WhatsApp, Discord", maxLength: 120 }),
      switchField("Mostrar o texto da mensagem (desligado: só “Nova notificação” e o app)", () => d.notify_text, v => { d.notify_text = v; commit(); }),
      h("div", { class: "row", style: "margin-top:6px" },
        h("button", { class: "btn small", onclick: async () => { try { await post("/api/notify_test", {}); toast("Aviso de teste enviado."); } catch (e) { toast(e.message, true); } } }, "Testar aviso")),
      h("div", { class: "hint", id: "notifinfo", style: "margin-top:8px" }, notifText())),
    h("details", { class: "group" }, h("summary", { class: "hint", style: "cursor:pointer;margin-bottom:10px" }, "Avançado"),
      switchField("Brilho com escala invertida (se o brilho agir ao contrário)", () => d.invert_brightness, v => { d.invert_brightness = v; commit(); }),
      selectField("Alinhamento das atualizações parciais (px)", [[1, "1"], [2, "2"], [4, "4"], [8, "8 — seguro (padrão)"], [16, "16"]],
        () => d.align, v => { d.align = +v; commit(); }),
      h("div", { class: "hint", style: "margin:-6px 0 12px" }, "Menor = menos dados enviados, mas algumas telas desenham errado em áreas não alinhadas. Se a imagem quebrar, volte para 8."),
      numField("Quadros por segundo (máx.)", () => d.fps, v => { d.fps = v; commit(); }, 2, 30)),
  ];
}
async function loadPorts() { try { S.ports = await api("/api/ports"); if (S.tab === "tela") renderPanel(); } catch (_) { S.ports = []; } }

// ------------------------------------------------------------------ panel: system
const SENSOR_LABELS = [["cpu", "CPU uso", "%"], ["cpu_temp", "CPU temperatura", " °C"], ["gpu", "GPU uso", "%"], ["gpu_temp", "GPU temperatura", " °C"],
  ["gpu_mem", "Memória de vídeo", "%"], ["ram", "RAM", "%"], ["disk", "Disco", "%"], ["net_down_h", "Download", ""], ["net_up_h", "Upload", ""]];
function panelSistema() {
  const a = S.autostart, sn = S.layout.sensors;
  const kv = h("div", { class: "kv", id: "sensorkv" }, h("span", {}, "Lendo sensores…"), h("span"));
  const src = h("div", { id: "sensorsrc" });
  setTimeout(refreshSensors, 0);
  return [
    h("div", { class: "group" }, h("h4", {}, "Inicialização"),
      switchField("Iniciar com o Windows (em segundo plano)", () => a.enabled, async v => {
        try { const r = await post("/api/autostart", { enabled: v }); S.autostart = r; toast(v ? "O Rhino's Buddy Supervisor vai iniciar com o Windows." : "Início automático desativado."); }
        catch (e) { toast(e.message, true); } renderPanel();
      }, !a.supported),
      a.supported ? h("div", { class: "hint" }, "Ao ligar o PC, a tela passa a funcionar sozinha, sem abrir esta janela. Para editar, abra o Rhino's Buddy Supervisor novamen"+"te pelo atalho.")
                  : h("div", { class: "note warn" }, "Disponível apenas no Windows (este computador não é Windows).")),
    h("div", { class: "group" }, h("h4", {}, "Sensores de hardware"),
      switchField("GPU NVIDIA via nvidia-smi", () => sn.nvidia_smi, v => { sn.nvidia_smi = v; commit(); }),
      switchField("LibreHardwareMonitor (temperatura da CPU, GPU AMD/Intel)", () => sn.lhm, v => { sn.lhm = v; commit(); }),
      h("div", { class: "hint", style: "margin-bottom:10px" }, "Para a temperatura da CPU: abra o LibreHardwareMonitor como administrador e ative Options → Remote Web Server → Run."),
      src, h("div", { class: "card", style: "margin-top:10px;padding:10px 12px" }, kv)),
    h("div", { class: "group" }, h("h4", {}, "Novidades"),
      switchField("Mostrar as novidades na primeira abertura de cada versão", () => !(S.whatsnew && S.whatsnew.hide), async v => {
        try { S.whatsnew = await post("/api/whatsnew", { hide: !v }); toast(v ? "As novidades voltam a aparecer a cada atualização." : "As novidades não aparecem mais."); } catch (e) { toast(e.message, true); }
      }),
      h("button", { class: "btn small", onclick: () => showWhatsNew(true) }, "Ver novidades desta versão")),
    h("div", { class: "group" }, h("h4", {}, "Programa"),
      h("div", { class: "row" },
        h("button", { class: "btn danger", onclick: async () => { if (confirm("Restaurar o layout e a aparência padrão? Suas imagens enviadas são mantidas.")) { const r = await post("/api/reset", {}); S.layout = r.layout; S.sel = -1; S.page = 0; renderAll(); toast("Padrões restaurados."); } } }, "Restaurar padrões"),
        h("button", { class: "btn danger", onclick: async () => { if (confirm("Encerrar o Rhino's Buddy Supervisor? A tela deixará de ser atualizada.")) { try { await post("/api/quit", {}); } catch (_) {} document.body.innerHTML = "<p style='padding:40px;color:#8b95a7'>Rhino's Buddy Supervisor encerrado. Você pode fechar esta janela.</p>"; } } }, "Encerrar programa")),
      h("div", { class: "hint", style: "margin-top:12px" }, "Versão " + S.version + (S.version_title ? " (" + S.version_title + ")" : "") + " · Seus dados ficam em ", h("code", {}, S.home))),
  ];
}
async function refreshSensors() {
  const kv = $("#sensorkv"); if (!kv || S.tab !== "sistema") return;
  try {
    const r = await api("/api/sensors");
    kv.replaceChildren(...SENSOR_LABELS.flatMap(([k, l, u]) => {
      const v = r.values[k]; const txt = v == null ? "--" : (typeof v === "number" ? (k.includes("temp") || k === "ram" || k === "disk" || k.startsWith("gpu") || k === "cpu" ? v.toFixed(0) : v) + u : v);
      return [h("span", {}, l), h("span", {}, txt)];
    }));
    const src = $("#sensorsrc"); if (src) src.replaceChildren(...r.sources.map(s => h("div", { class: "src " + (s.ok ? "ok" : "bad") }, h("span", { class: "dot" }), s.name + (s.ok ? ": funcionando" : ": não encontrado"))));
  } catch (_) {}
  if (S.tab === "sistema") setTimeout(refreshSensors, 1500);
}

// ------------------------------------------------------------------ what's new pop-up
function showWhatsNew(manual) {
  const w = S.whatsnew, n = w && w.notes;
  if (!n || document.querySelector(".modal")) { if (manual && !n) toast("Esta versão não tem novidades registradas."); return; }
  const never = h("input", { type: "checkbox", checked: !!w.hide });
  const close = async () => {
    box.remove(); document.removeEventListener("keydown", onKey);
    try { S.whatsnew = await post("/api/whatsnew", { seen: true, hide: never.checked }); } catch (_) {}
    if (S.tab === "sistema") renderPanel();
  };
  const onKey = e => { if (e.key === "Escape") close(); };
  const box = h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": "Novidades", onclick: e => { if (e.target === box) close(); } },
    h("div", { class: "box" },
      h("h2", {}, "Novidades da versão " + n.version),
      h("div", { class: "sub" }, n.title),
      h("ul", {}, n.items.map(t => h("li", {}, t))),
      h("div", { class: "foot" },
        h("label", { class: "sw" }, never, "Não mostrar novamente"),
        h("button", { class: "btn primary", onclick: close }, "Entendi"))));
  document.addEventListener("keydown", onKey);
  document.body.append(box);
}

// ------------------------------------------------------------------ theme (light / dark)
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  const b = $("#themebtn"); if (b) b.textContent = t === "light" ? "🌙 Modo escuro" : "☀ Modo claro";
  try { localStorage.setItem("theme", t); } catch (_) {}
}
$("#themebtn").addEventListener("click", () => applyTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light"));
applyTheme(document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark");

// ------------------------------------------------------------------ shell
function renderPanel() {
  const p = $("#panel"), keep = p.scrollTop; p.replaceChildren(...({ modulo: panelModulos, aparencia: panelAparencia, tela: panelTela, sistema: panelSistema }[S.tab])());
  p.scrollTop = keep;
}
function renderAll() { renderPages(); renderPageCfg(); renderStage(); renderPanel(); focusPage(); }
document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => {
  S.tab = b.dataset.tab; document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  if (S.tab === "tela") S.ports = null;
  $("#panel").scrollTop = 0; renderPanel();
}));
function updateStatus() {
  const st = S.status || {}, pill = $("#pill");
  pill.className = "pill " + (st.connected ? "ok" : "");
  $("#pilltext").textContent = st.connected ? "Tela conectada" + (st.port ? " · " + st.port : "") : "Sem tela · pré-visualização";
  pill.title = st.message || "";
  const c = $("#statuscard"); if (c) c.replaceWith(statusCard());
  const u = $("#usbinfo"); if (u) u.textContent = usbText();
  const ni = $("#notifinfo"); if (ni) ni.textContent = notifText();
}
async function pollStatus() {
  try { const st = await api("/api/status"); if (JSON.stringify(st) !== JSON.stringify(S.status)) { S.status = st; updateStatus(); } } catch (_) {
    $("#pill").className = "pill bad"; $("#pilltext").textContent = "Programa não responde";
  }
  setTimeout(pollStatus, 2000);
}
let liveBusy = false;
function refreshLive() {
  if (liveBusy) return; liveBusy = true;
  const img = new Image();
  img.onload = () => { $("#live").src = img.src; liveBusy = false; };
  img.onerror = () => { liveBusy = false; };
  img.src = "/api/preview.png?t=" + Date.now();
}
// keeps the physical screen on the page being edited (it goes back to rotating when the editor is idle)
function focusPage() { if (S.layout && !document.hidden) post("/api/focus", { page: S.page }).catch(() => {}); }
setInterval(focusPage, 15000);
document.addEventListener("visibilitychange", focusPage);
async function init() {
  try { $("#showgrid").checked = localStorage.getItem("grid") !== "0"; } catch (_) { $("#showgrid").checked = true; }
  try {
    const st = await api("/api/state");
    Object.assign(S, { layout: st.layout, cat: st.catalog, status: st.status, media: st.media, autostart: st.autostart, home: st.home, version: st.version, version_title: st.version_title, whatsnew: st.whatsnew });
  } catch (e) { document.body.innerHTML = "<p style='padding:40px'>Não foi possível falar com o programa: " + e.message + "</p>"; return; }
  renderAll(); updateStatus(); pollStatus(); setInterval(refreshLive, 600); refreshLive();
  if (S.whatsnew && S.whatsnew.show) showWhatsNew(false);
}
init();
</script>
</body>
</html>
