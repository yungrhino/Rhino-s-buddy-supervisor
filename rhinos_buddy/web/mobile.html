<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>Rhino's Buddy</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#8b95a7;font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#frame{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;image-rendering:auto}
#frame.rot{position:absolute;left:50%;top:50%;max-width:none;max-height:none;transform:translate(-50%,-50%) rotate(90deg)}
#msg{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;padding:0 16px;pointer-events:none}
#msg.err{color:#ff8787}
#bar{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;display:flex;gap:8px;opacity:.85;transition:opacity .4s}
#bar.hide{opacity:0;pointer-events:none}
#bar button{background:#ffffff1f;color:#e6e9ef;border:0;border-radius:8px;padding:9px 13px;font-size:14px}
</style>
</head>
<body>
<div id="stage"><img id="frame" alt=""></div>
<div id="bar"><button id="rot" type="button"></button><button id="fs" type="button"></button></div>
<div id="msg"></div>
<script>
(function () {
  "use strict";
  var pt = (navigator.language || "").toLowerCase().indexOf("pt") === 0;
  var T = pt ? { rot: "Girar", fs: "Tela cheia", conn: "Conectando ao PC…", lost: "Sem conexão com o PC. Tentando de novo…",
                 bad: "Link inválido ou trocado. Escaneie o QR code de novo no PC.", locked: "Muitas tentativas. Aguarde alguns minutos." }
             : { rot: "Rotate", fs: "Fullscreen", conn: "Connecting to the PC…", lost: "Lost the connection to the PC. Retrying…",
                 bad: "Invalid or replaced link. Scan the QR code on the PC again.", locked: "Too many attempts. Wait a few minutes." };
  var $ = function (id) { return document.getElementById(id); };
  var img = $("frame"), msg = $("msg"), bar = $("bar");
  $("rot").textContent = T.rot; $("fs").textContent = T.fs;
  var token = new URLSearchParams(location.search).get("t") || "";
  var url = "";
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var rot = store.get("rot") === "1";
  function applyRot() { img.className = rot ? "rot" : ""; fit(); }
  function fit() {  // when rotated, the picture is laid out as if the screen were turned: swap the limits
    if (!rot) { img.style.width = img.style.height = ""; return; }
    var vw = window.innerWidth, vh = window.innerHeight, w = img.naturalWidth || 480, h = img.naturalHeight || 320;
    var s = Math.min(vh / w, vw / h);
    img.style.width = Math.round(w * s) + "px"; img.style.height = Math.round(h * s) + "px";
  }
  window.addEventListener("resize", fit);
  $("rot").onclick = function () { rot = !rot; store.set("rot", rot ? "1" : "0"); applyRot(); };
  var fsEl = document.documentElement;
  var reqFs = fsEl.requestFullscreen || fsEl.webkitRequestFullscreen;
  if (!reqFs) $("fs").style.display = "none";  // iOS Safari has no fullscreen for pages: the buttons simply do not show it
  $("fs").onclick = function () {
    try { if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else reqFs.call(fsEl); } catch (e) {}
  };
  var hideTimer = 0;
  function wake() { bar.className = ""; clearTimeout(hideTimer); hideTimer = setTimeout(function () { bar.className = "hide"; }, 3500); }
  document.addEventListener("click", wake); document.addEventListener("touchstart", wake, { passive: true }); wake();

  var lock = null;  // keep the phone awake while the page is visible (where the browser allows it)
  function keepAwake() {
    try { if (navigator.wakeLock && document.visibilityState === "visible") navigator.wakeLock.request("screen").then(function (l) { lock = l; }, function () {}); } catch (e) {}
  }
  document.addEventListener("visibilitychange", keepAwake); keepAwake();

  var failures = 0, busy = false, timer = 0;
  function stop() { clearInterval(timer); timer = 0; }  // a refused link is never retried (it would only trip the lockout)
  function say(text, err) { msg.textContent = text || ""; msg.className = err ? "err" : ""; }
  say(T.conn);
  function tick() {
    if (busy || document.visibilityState !== "visible") return;
    busy = true;
    fetch("/m/frame.jpg?t=" + encodeURIComponent(token) + "&_=" + Date.now(), { cache: "no-store", credentials: "omit", referrerPolicy: "no-referrer" })
      .then(function (r) {
        if (r.status === 403) { stop(); say(T.bad, true); throw new Error("forbidden"); }
        if (r.status === 429) { stop(); say(T.locked, true); throw new Error("locked"); }
        if (!r.ok) throw new Error("http " + r.status);
        return r.blob();
      })
      .then(function (b) {
        var old = url; url = URL.createObjectURL(b);
        img.onload = function () { fit(); if (old) URL.revokeObjectURL(old); };
        img.src = url; failures = 0; say("");
      })
      .catch(function () { if (timer) { failures++; if (failures > 3) say(T.lost, true); } })
      .then(function () { busy = false; });
  }
  timer = setInterval(tick, 125);  // ~8 pictures a second at most; a slow link just skips ahead
  tick(); applyRot();
})();
</script>
</body>
</html>
