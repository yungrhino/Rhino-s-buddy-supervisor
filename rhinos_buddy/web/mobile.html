<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>Rhino's Buddy</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#8b95a7;font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#frame{display:block;flex:none;image-rendering:auto}
#frame.rot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg)}
#msg{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;padding:0 16px;pointer-events:none}
#msg.err{color:#ff8787}
#bar{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;display:flex;gap:8px;opacity:.85;transition:opacity .4s}
#bar.hide{opacity:0;pointer-events:none}
#bar button,#bar a{text-decoration:none;background:#ffffff1f;color:#e6e9ef;border:0;border-radius:8px;padding:9px 13px;font-size:14px}
</style>
</head>
<body>
<div id="stage"><img id="frame" alt=""></div>
<div id="bar"><a id="panel" href="/"></a><button id="rot" type="button"></button><button id="fs" type="button"></button></div>
<div id="msg"></div>
<script>
(function () {
  "use strict";
  var pt = (navigator.language || "").toLowerCase().indexOf("pt") === 0;
  var T = pt ? { panel: "Painel", rot: "Giro", auto: "auto", off: "não", on: "sim", fs: "Tela cheia", conn: "Conectando ao PC…", lost: "Sem conexão com o PC. Tentando de novo…",
                 bad: "Sessão encerrada. Escaneie o QR code de novo no PC.", locked: "Muitas tentativas. Aguarde alguns minutos." }
             : { panel: "Panel", rot: "Rotate", auto: "auto", off: "off", on: "on", fs: "Fullscreen", conn: "Connecting to the PC…", lost: "Lost the connection to the PC. Retrying…",
                 bad: "Session ended. Scan the QR code on the PC again.", locked: "Too many attempts. Wait a few minutes." };
  var $ = function (id) { return document.getElementById(id); };
  var img = $("frame"), msg = $("msg"), bar = $("bar");
  $("fs").textContent = T.fs; $("panel").textContent = T.panel;
    var url = "";
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  // Turn mode: "auto" picks the way that shows the picture biggest (so a portrait layout fills a portrait phone and a
  // landscape one fills a phone held sideways, whatever the website preview uses), "off" never turns it, "on" always does.
  var mode = store.get("rotmode"); if (mode !== "off" && mode !== "on") mode = "auto";
  var rot = false;
  function scales() {
    var vw = window.innerWidth, vh = window.innerHeight, w = img.naturalWidth || 480, h = img.naturalHeight || 320;
    return { w: w, h: h, plain: Math.min(vw / w, vh / h), turned: Math.min(vh / w, vw / h) };
  }
  function fit() {
    var m = scales();
    rot = mode === "on" || (mode === "auto" && m.turned > m.plain * 1.04);  // a small margin avoids flip-flopping on squarish pictures
    var s = rot ? m.turned : m.plain;
    img.className = rot ? "rot" : "";
    img.style.width = Math.round(m.w * s) + "px"; img.style.height = Math.round(m.h * s) + "px";
    $("rot").textContent = T.rot + ": " + T[mode];
  }
  function applyRot() { fit(); }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", function () { setTimeout(fit, 150); });
  $("rot").onclick = function () { mode = mode === "auto" ? "off" : mode === "off" ? "on" : "auto"; store.set("rotmode", mode); fit(); };
  var fsEl = document.documentElement;
  var reqFs = fsEl.requestFullscreen || fsEl.webkitRequestFullscreen;
  if (!reqFs) $("fs").style.display = "none";  // iOS Safari has no fullscreen for pages: the buttons simply do not show it
  $("fs").onclick = function () {
    try { if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else { var r = reqFs.call(fsEl); var lockOr = function () { try { var m = scales(); screen.orientation.lock(m.w >= m.h ? "landscape" : "portrait").catch(function () {}); } catch (e) {} };
      if (r && r.then) r.then(lockOr, function () {}); else lockOr(); } } catch (e) {}
  };
  var hideTimer = 0;
  function wake() { bar.className = ""; clearTimeout(hideTimer); hideTimer = setTimeout(function () { bar.className = "hide"; }, 3500); }
  document.addEventListener("click", wake); document.addEventListener("touchstart", wake, { passive: true }); wake();

  var lock = null;  // keep the phone awake while the page is visible (where the browser allows it)
  function keepAwake() {
    try { if (navigator.wakeLock && document.visibilityState === "visible") navigator.wakeLock.request("screen").then(function (l) { lock = l; }, function () {}); } catch (e) {}
  }
  document.addEventListener("visibilitychange", keepAwake); keepAwake();

  var failures = 0, busy = false, timer = 0;
  function stop() { clearInterval(timer); timer = 0; }  // a refused link is never retried (it would only trip the lockout)
  function say(text, err) { msg.textContent = text || ""; msg.className = err ? "err" : ""; }
  say(T.conn);
  function tick() {
    if (busy || document.visibilityState !== "visible") return;
    busy = true;
    fetch("/m/frame.jpg?_=" + Date.now(), { cache: "no-store", credentials: "same-origin", referrerPolicy: "no-referrer" })
      .then(function (r) {
        if (r.status === 403) { stop(); say(T.bad, true); throw new Error("forbidden"); }
        if (r.status === 429) { stop(); say(T.locked, true); throw new Error("locked"); }
        if (!r.ok) throw new Error("http " + r.status);
        return r.blob();
      })
      .then(function (b) {
        var old = url; url = URL.createObjectURL(b);
        img.onload = function () { fit(); if (old) URL.revokeObjectURL(old); };
        img.src = url; failures = 0; say("");
      })
      .catch(function () { if (timer) { failures++; if (failures > 3) say(T.lost, true); } })
      .then(function () { busy = false; });
  }
  timer = setInterval(tick, 125);  // ~8 pictures a second at most; a slow link just skips ahead
  tick(); applyRot();
})();
</script>
</body>
</html>
