[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subscreen"
version = "0.1.0"
description = "Open source driver and widget engine for 3.5-inch USB secondary screens"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyserial>=3.5", "Pillow>=10.1", "numpy", "psutil"]

[project.scripts]
subscreen = "subscreen.cli:main"
subscreen-app = "subscreen.app:main"

[tool.setuptools.packages.find]
include = ["subscreen*"]

[tool.setuptools.package-data]
subscreen = ["web/*.html"]
